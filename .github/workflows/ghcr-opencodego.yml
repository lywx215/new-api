name: Publish GHCR image (OpenCodeGo)

on:
  push:
    tags:
      - 'v*-opencodego*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true
        type: string
      use_release_binary:
        description: 'Publish only linux/amd64 using the verified release binary'
        required: false
        type: boolean
        default: false
      expected_source:
        description: 'Expected release source commit (40 hexadecimal characters)'
        required: false
        type: string
        default: ''
      expected_sha256:
        description: 'Expected release binary SHA-256 (64 hexadecimal characters)'
        required: false
        type: string
        default: ''

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/new-api

jobs:
  frontend:
    name: Build frontend once
    if: ${{ !inputs.use_release_binary }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "$TAG" > VERSION

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build frontend
        env:
          CI: ''
          VITE_REACT_APP_VERSION: ${{ env.TAG }}
        run: |
          cd web
          bun install --frozen-lockfile || (rm -rf node_modules && bun install --frozen-lockfile)
          DISABLE_ESLINT_PLUGIN='true' bun run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and push (${{ matrix.arch }})
    if: ${{ !inputs.use_release_binary }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "$TAG" > VERSION

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'

      - name: Build backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOEXPERIMENT: greenteagc
        run: go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${TAG}'" -o new-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/docker/Dockerfile.ghcr
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:opencodego-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  manifest:
    name: Publish multi-arch manifests
    if: ${{ !inputs.use_release_binary }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${TAG}" \
            "${IMAGE_NAME}:${TAG}-amd64" \
            "${IMAGE_NAME}:${TAG}-arm64"

      - name: Publish rolling OpenCodeGo manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:opencodego" \
            "${IMAGE_NAME}:opencodego-amd64" \
            "${IMAGE_NAME}:opencodego-arm64"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"

  publish-release-amd64:
    name: Publish verified release binary (linux/amd64)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_release_binary }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      TEST_IMAGE: opencodego-release-check:${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+-opencodego\.[0-9]+$ ]]; then
            echo '::error::Invalid OpenCodeGo release tag'
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo '::error::Expected source must contain exactly 40 hexadecimal characters'
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo '::error::Expected SHA-256 must contain exactly 64 hexadecimal characters'
            exit 1
          fi
          printf 'EXPECTED_SOURCE=%s\n' "${EXPECTED_SOURCE,,}" >> "$GITHUB_ENV"
          printf 'EXPECTED_SHA256=%s\n' "${EXPECTED_SHA256,,}" >> "$GITHUB_ENV"

      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse HEAD)"
          if [[ "$source_revision" != "$EXPECTED_SOURCE" ]]; then
            echo '::error::Checked-out tag does not match the expected release source'
            exit 1
          fi
          printf 'SOURCE_REVISION=%s\n' "$source_revision" >> "$GITHUB_ENV"

      - name: Download and verify release binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d "${RUNNER_TEMP}/opencodego-release-amd64.XXXXXXXX")"
          binary="new-api-${TAG}"
          gh release download "$TAG" --repo "$GH_REPO" \
            --pattern "$binary" --pattern checksums-linux.txt --dir "$release_dir"
          cd "$release_dir"
          mapfile -t checksum_lines < checksums-linux.txt
          if [[ "${#checksum_lines[@]}" != 1 ]]; then
            echo '::error::Expected a checksum manifest containing only the requested binary'
            exit 1
          fi
          read -r manifest_sha manifest_file extra <<< "${checksum_lines[0]}"
          if [[ ! "$manifest_sha" =~ ^[[:xdigit:]]{64}$ || "$manifest_file" != "$binary" || -n "$extra" ]]; then
            echo '::error::Checksum manifest does not name the requested release binary'
            exit 1
          fi
          sha256sum --strict -c checksums-linux.txt
          actual_sha="$(sha256sum "$binary")"
          if [[ "${actual_sha%% *}" != "$EXPECTED_SHA256" ]]; then
            echo '::error::Release binary does not match the independently expected SHA-256'
            exit 1
          fi
          chmod 755 "$binary"
          binary_version="$(env -u VERSION -u SQL_DSN -u LOG_SQL_DSN -u REDIS_CONN_STRING "./$binary" -version)"
          if [[ "$binary_version" != "$TAG" ]]; then
            echo '::error::Release binary reports a different version'
            exit 1
          fi
          go version -m "$binary" > build-info.txt
          grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$' build-info.txt
          grep -Eq '^[[:space:]]*build[[:space:]]+GOARCH=amd64$' build-info.txt
          grep -Eq '^[[:space:]]*build[[:space:]]+GOOS=linux$' build-info.txt
          grep -Eq "^[[:space:]]*build[[:space:]]+vcs.revision=${EXPECTED_SOURCE}$" build-info.txt
          grep -Fq "common.Version=${TAG}" build-info.txt
          install -m 755 "$binary" "$GITHUB_WORKSPACE/new-api"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/docker/Dockerfile.ghcr
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=opencodego-release-amd64
          cache-to: type=gha,mode=max,scope=opencodego-release-amd64
          provenance: false
          sbom: false

      - name: Verify packaged binary without network access
        shell: bash
        run: |
          set -euo pipefail
          image_version="$(docker run --rm --network none "$TEST_IMAGE" -version)"
          if [[ "$image_version" != "$TAG" ]]; then
            echo '::error::Packaged binary reports a different version'
            exit 1
          fi
          image_sha="$(docker run --rm --network none --entrypoint sha256sum "$TEST_IMAGE" /new-api)"
          if [[ "${image_sha%% *}" != "$EXPECTED_SHA256" ]]; then
            echo '::error::Packaged binary does not match the verified release binary'
            exit 1
          fi
          printf 'IMAGE_BINARY_SHA256=%s\n' "${image_sha%% *}"
          printf 'IMAGE_BINARY_VERSION=%s\n' "$image_version"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified linux/amd64 image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/docker/Dockerfile.ghcr
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=opencodego-release-amd64
          cache-to: type=gha,mode=max,scope=opencodego-release-amd64
          provenance: mode=max
          sbom: true

      - name: Report published image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo '::error::Published image digest is missing or invalid'
            exit 1
          fi
          printf 'IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST"
